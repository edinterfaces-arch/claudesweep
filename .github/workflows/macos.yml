name: macOS app and DMG
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test, build and package DMG
        env:
          SWEEP_NO_REVEAL: "1"
        run: bash Package-DMG.command
      - name: Upload DMG and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeSweep-macOS
          path: |
            dist/*.dmg
            dist/*.dmg.sha256
          if-no-files-found: error
